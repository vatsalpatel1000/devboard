# Goal - To Ensure no secrets have been committed to the repository. This workflow will scan the codebase for any secrets using GitLeaks.

name: Secrets Scanning

on:
    workflow_call:

jobs:
    scan-secrets:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0  

            - name: GitLeaks Scanner
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
