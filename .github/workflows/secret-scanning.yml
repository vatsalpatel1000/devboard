# Goal - To Ensure no secrets have been committed to the repository. This workflow will scan the codebase for any secrets using GitLeaks.

name: Secrets Scanning

on:
    workflow_call:

jobs:
    scan-secrets:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0                                      # sare commitns ko checkout karega, kyuki gitleaks ko sare commit history me scan karna hoga  

            - name: GitLeaks Scanner                                # Github pr credential leak ho gya to use check karega
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}         # by default , GitHub Actions me GITHUB_TOKEN available hota h, jisse repo ke liye access milta h.
