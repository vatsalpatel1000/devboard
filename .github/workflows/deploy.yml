# Goal: Deploy build img from CI once CI is successful. This will be triggered on push to master branch.

name: Devboard CD
on:
    # workflow_dispatch:                                # Ye workflow manually trigger ho sakta hai GitHub Actions tab se
     workflow_call                                      # aage se aane wali workflow ko call karega or uske sath jud jaega   
jobs:
    deploy:
        runs-on: self-hosted                             # CD ko hmesha self hosted pr chlao
        steps:
            - name: code checkout
              uses: actions/checkout@v7
              
            - name: copy example Env to main env            # Copy to .env taki runner me docker-compose.yml chl ske 
              run: cp .env.example .env
            
    # Step 2: Docker Hub mein login karega
            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: vatsalpatel1000
                password: ${{ secrets.DOCKERHUB_TOKEN }}    # Docker Hub token Github Secrets se lega

            - name: Deploy the containers with docker compose
              run: |
                  docker compose version
                  docker compose pull
                  docker compose up -d
                # Docker Compose installation verify karega
                # Docker Hub se latest images pull karega
                # Containers ko background mein start karegaa