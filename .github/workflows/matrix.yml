name: Go Linter

on:

    # env:
    #     DOCKERHUB_USER: ${{ vars.secrets.DOCKER_USERNAME }}    # github ki cid pipeline me jo apne dockerhub username hai usko use krskte h yha variable declare krke

    
  #workflow_call:                    # aage se aane wali workflow ko call karega or uske sath jud jaega

  # schedule:                         # Cronjob ke liye schedule set karega
  #   - cron: '*/5 * * * *'                   

  workflow_dispatch:                # workflow ko manually (haath se) run karne ki suvidha deta hai, bina code push kiye. 
                                    # Github -> actions -> Workflow name (Go Linter) -> Run workflow -Button active ho jaega
jobs:
    code-format:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                go: ['1.25', '1.26']
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                go-version: ${{ matrix.go }}
                cache-dependency-path: backend/go.sum

            - name: Run Go Formatter
              run: go fmt ./...
              working-directory: backend

            - name: Run Go Vet
              run: go vet ./...
              working-directory: backend
