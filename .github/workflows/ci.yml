name: Devboard Frontend CI

on:
  push:
    branches:
      - master

jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # this step will install python
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # ESLint and Prettier must be in `package.json`
      - name: Install Node.js dependencies
        run: npm ci

      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          prettier: true
    
  build-and-push:
    needs: [code-lint] 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
           username: vatsalpatel1000
           password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: vatsalpatel1000/devboard-fe-master:latest

