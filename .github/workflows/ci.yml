# frontend & backend dono ke liye docker image build aur push karega - 
  build-and-push:                       # ye fronend & backend dono ke liye docker image build aur push karega - ye job dono ke liye run hoga loop me              
    needs: [Frontend, Backend ]
    runs-on: ubuntu-latest
    # Github runner

    strategy:
      fail-fast: false
      matrix:
        service: [Frontend, Backend]
        # Ye matrix define karta hai ki ye job dono services ke liye run hoga - build-and-push-To-DockerHub aur build-and-push-DockerHub dono ko comment kr skte h -= dono ka same work h
    steps:
      # Step 1: Github repository ka code download karega
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Docker Hub mein login karega
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: vatsalpatel1000
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          # Docker Hub token Github Secrets se lega

      # Step 3: Docker image build aur push karega
      - name: Docker Build and Push
        uses: docker/build-push-action@v4
        with:
          # context: ./frontend       me chlega      
          context:   ./${{ matrix.service == 'Frontend' && 'frontend' || 'backend' }}
          # Docker build ka context frontend ya backend folder hoga
          # Matrix ke according frontend ya backend folder build context hoga


          # file:  ./frontend/Dockerfile         Frontend ki ye dockerfile chlegi 
          file:    ./${{ matrix.service == 'Frontend' && 'frontend' || 'backend' }}/Dockerfile
          # Dockerfile ka name kuch or ni ho skta Github actions me DockerFile hi rhna chaiye wrna pipeline ni chlegi 
          # Dockerfile ka path         # Matrix ke according respective Dockerfile use hoga

          push: true
          # Build hone ke baad image Docker Hub par push hogi

          tags:   vatsalpatel1000/devboard-${{ matrix.service == 'Frontend' && 'fe' || 'be' }}-master:latest
          # Docker image ka naam aur tag    
          # Frontend: vatsalpatel1000/devboard-fe-master:latest
          # Backend: vatsalpatel1000/devboard-be-master:latest    

      
            
  
       
  
  deploy:                             # yha se aage Cd.Yml ko bhejo  
    needs: [Frontend, Backend, build-and-push]
    uses: ./.github/workflows/cd.yml              # yha se aage isko connect kro - secrets ke sath
    secrets: inherit
# YHA APNA GITHUB ACTION KA CICD PIPELINE KA CI PART DONE HO GYA HAI. AB APN CD PART BNAENGE JISME APN DOCKER IMAGE KO KUBERNETES CLUSTER ME DEPLOY KRENGE.          