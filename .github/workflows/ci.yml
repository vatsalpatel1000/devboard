# Goal : Build th inmage for Devboard Frontend & Push to docker hub 

on:
  push:
    branches: [master]
  # paths: "*.py"                  # .py wali file se kuch push hua h to hi trigger hogi

jobs:
  build-and-push: 
    runs-on: ubuntu-latest         # github free runner
    steps:
      - name: Check out
        uses: actions/checkout@v7    # step run hone ke baad code delete ho jaega runner ke lie. isliye apn multple steps ek hi job me likhte h taki next code usi runner pr chle jo install hua h
                                     # agrr docker install krne ke lie alg se step bnaya to wo uss runner pr chlega hi ni. isliye multiple step ek job ke andr likhte h
      - name: Docker Setup
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCERHUB_USERNAME }}
          passowrd: ${{ secrets.DOCERHUB_TOKEN }}
          
#      - name: Docker Build
          
