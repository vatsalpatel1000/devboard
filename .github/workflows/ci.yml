# Goal : Lint (for code syntex), Build, Test the code for Devboard Frontend, Backend 
#      : Push images to Docker Hub 


# Workflow ka naam jo GitHub Actions tab mein dikhega
name: Devboard CI

# Ye workflow kab execute hoga?
on:
  push:
    branches:
      - master  # Sirf master branch par push hone par run hoga

# Jobs define karte hain
jobs:
  # JOB-1
  Frontend:
    runs-on: ubuntu-latest  # GitHub ka Ubuntu runner use hoga

    steps:
      # Step 1: GitHub repository ka code runner mein download karega
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Runner mein Node.js install karega
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Node.js version
          cache: npm  # npm packages ka cache maintain karega
          cache-dependency-path: frontend/package-lock.json
          # Lock file ke basis par cache dependencies identify hongi

      # Step 3: Frontend ki dependencies install karega
      - name: Install Node.js dependencies
        working-directory: frontend
        run: npm ci
        # package-lock.json mein locked versions install honge
        # npm ci clean aur reproducible installation karta hai

      # Step 4: ESLint run karega
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint
        # package.json ke lint script ko execute karega
        # Source code mein linting errors check karega

      # Step 5: Frontend tests execute karega
      - name: Run Tests
        working-directory: frontend
        run: npm run test
        # package.json ke test script ko execute karega
        # Vitest ke through automated tests run honge

  # # JOB 2: Docker image build aur push karega     Yha se Dusra runner bnega ya dusra ubuntu use krenege 
  # # isko replace krenge lint wale buil-push ke sath jo ki frontend aur backend dono ke liye docker image build aur push karega
