  # JOB-2
  Backend:
    runs-on: ubuntu-latest  # GitHub ka Ubuntu runner use hoga

    steps:
      # Step 1: GitHub repository ka code runner mein download karega
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Runner mein Node.js install karega
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26                              # go version
          go-version-file: 'go.mod'                     # Go module file for dependency management
          cache-dependency-path: backend/go.sum         # cache dependencies identify hongi

      # Step 3: Backend ki Go ki dependencies install karega
      - name: Run Go Formatter
        working-directory: backend
        run: go fmt             # Dependency management ke liye go mod use hoga. go.sum file ke basis par dependencies install hongi


      # Step 4: ESLint run karega
      - name: Run go vetter
        working-directory: backend
        run: go vet


      # Step 5: Backend tests execute karega
      - name: Run Tests
        working-directory: backend
        run: go test
        # package.json ke test script ko execute karega
        # Vitest ke through automated tests run honge

