name: Devboard Frontend CI

on:
  push:
    branches:
      - master

jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # this step will install python
      - name: Set up Python
        uses: actions/setup-python@v5       # python install on runner - github action ka prebuild function h
        with:
          python-version: '3.14'            # python version

    # this step will install the linting tool 
      - name: Install Linter                # install linter for python code ka format check 
        run: pip install ruff
      
      # this step will run the linter
      - name: Check the files for linting      
        run: ruff check .  
    
  build-and-push:
    needs: [code-lint] 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
           username: vatsalpatel1000
           password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: vatsalpatel1000/devboard-fe-master:latest

