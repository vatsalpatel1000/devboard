#Goal: To ensure my running application is free from OWASP Top 10 security issues. 
# # search on browser -  OWASP ZAP Github Actions - Docs se code copy kro ye wala 
name: OWASP ZAP DAST Scan

on:
  workflow_call:
#     inputs:
#       target_url:
# #        description: URL to scan (e.g. http://<nlb-hostname>/)
#         description: http://65.0.105.112:8080/
#         required: true
#         type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://${{ secrets.EC2_HOST }}:8080'
          fail_action: false
          allow_issue_writing: false





# search on browser   Add Github action job reports save to artifacts - Docs se code copy kro ye wala                
      - name: Upload Reports                      # artifacts me reports upload karega taki workflow ke run hone ke baad bhi reports ko access kiya ja sake
        if: always()                              # agr test fail hua to bi reports upload hongi
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report            # report ka name
          path: reports/                          # path jaha report save h
          retention-days: 5                       # 5 din tkk artifacts ko access kiya ja skta h, 5 din ke baad ye delete ho jayega

