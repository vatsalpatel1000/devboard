# Goal: Ensure docekr file & docker image r security Tested   
name: Docker Scan

on: 
    workflow_call:

jobs:
    docker-file-lint-and-scan:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false                                          # ek fail hua to bi dusre ke lie chlega
            matrix:
                folders: ['backend','frontend','ai-service']
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7


# docker file linting ke lie Hadolint Action use kiya h, jisse docker file me vulnerability, bugs check honge aur report generate hogi
# search on browser   how to do hadolint dockerfile linting - Docs se code copy kro ye wala               
            - name: ${{ matrix.folders}} Dockerfile Lint
              uses: hadolint/hadolint-action@v3.5.0
              with:
                dockerfile: ${{ matrix.folders}}/Dockerfile
              
            - name: Docker Hardened Images [Login]
              uses: docker/login-action@v4
              with:
                registry: dhi.io
            #    username: ${{ vars.DOCKERHUB_USERNAME }}
                username: vatsalpatel1000
                password: ${{ secrets.DOCKERHUB_TOKEN }}

# Docker Image build krne ke lie docker build command use kiya h, jisse docker file se image banegi aur scan ke lie ready hogi  
# image ko build krenge phle run krenge runner pr hi fir push krenge HUB pr.               
            - name: Docker Build ${{ matrix.folders}}
              run: docker build -t vatsalpatel1000/devboard-${{ matrix.folders }}:ci .
              working-directory: ${{ matrix.folders}}

            # # Make the auto-detected instrumentation set reviewable: bootstrap resolves
            # # packages at build time, so record what this build actually contains.
            # - name: Record OpenTelemetry bootstrap set
            #   if: matrix.folders == 'ai-service'
            #   run: |
            #     mkdir -p reports
            #     docker run --rm --entrypoint opentelemetry-bootstrap devboard-${{ matrix.folders }}:ci -a requirements > reports/otel-bootstrap-requirements.txt
            #     cat reports/otel-bootstrap-requirements.txt

            # - name: Upload OpenTelemetry bootstrap set
            #   if: matrix.folders == 'ai-service'
            #   uses: actions/upload-artifact@v4
            #   with:
            #     name: otel-bootstrap-requirements
            #     path: reports/otel-bootstrap-requirements.txt


# search on browser -  trivy action github - Docs se code copy kro ye wala 
# Docker Image scan krne ke lie, add krenge. Trivy Action to scan vulnerabilities in the docker image and generate a report
            - name: Run Trivy vulnerability scanner                   
              uses: aquasecurity/trivy-action@v0.36.0
              continue-on-error: true
              with:
                image-ref: vatsalpatel1000/devboard-${{ matrix.folders }}:ci .               # docker repo me build ki hui image ko trivy uthaega or usko scan krega
                format: 'table'
                exit-code: '1'                       # Agr severity: 'CRITICAL Ya HIGH' hui to stop hoga. to fir return me 1 aagega.
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'
             
# Agr workflow me Docker file se related koi issue aae to usko Docker Gorden AI se new docker file bnawa skte h. Docker desktop me dockerfile ka code de ke ki ye issue aara h fir ai se fix krwa skt h 
# YA fir - terminal pr folder me ja ke 'docker ai' run kr ke - dockerfile ko theek krne ko bol skte h gorden ai ko. 

# multistage img vs distroless image kya hotah  ?       multistage me upr wale stage se nichey wale stasge me copy kr deti h , distroless is best use case for multistage image 
